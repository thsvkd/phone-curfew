<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커퓨 앱 기획 문서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#191C22; --soft:#666E7D; --hair:#DFE2E8;
  --accent:#2B5BD7; --accent-dim:#E8EDFB; --ok:#137A47; --quiet:#EEF0F4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --card:#181C23; --ink:#E8EBF1; --soft:#98A0B0; --hair:#282E39;
    --accent:#8CA9FF; --accent-dim:#1C2440; --ok:#54D08D; --quiet:#12161C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --card:#181C23; --ink:#E8EBF1; --soft:#98A0B0; --hair:#282E39;
  --accent:#8CA9FF; --accent-dim:#1C2440; --ok:#54D08D; --quiet:#12161C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR","Malgun Gothic",sans-serif; font-size:15px; line-height:1.75;
}
.shell{max-width:1240px; margin:0 auto; display:grid; grid-template-columns:250px minmax(0,1fr); gap:36px; padding:28px 24px 150px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr; gap:20px}
  .rail{position:static !important; max-height:none !important}
}
/* 왼쪽 레일 */
.rail{position:sticky; top:28px; align-self:start; max-height:calc(100vh - 56px); overflow-y:auto}
.rail .home{display:inline-block; font-size:12.5px; color:var(--soft); text-decoration:none; margin-bottom:14px}
.rail .home:hover{color:var(--accent); text-decoration:underline}
.tabs{display:flex; gap:6px; margin-bottom:18px}
.tabs button{
  flex:1; font-family:inherit; font-size:13px; font-weight:700; padding:8px 10px; cursor:pointer;
  background:var(--card); color:var(--soft); border:1px solid var(--hair); border-radius:7px;
}
.tabs button.on{background:var(--accent); border-color:var(--accent); color:#fff}
.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.toc-label{font-size:11px; letter-spacing:.1em; color:var(--soft); font-weight:500; margin:0 0 8px}
.toc{list-style:none; margin:0; padding:0; border-left:1px solid var(--hair)}
.toc li a{
  display:block; padding:4px 0 4px 12px; margin-left:-1px; font-size:13px; line-height:1.5;
  color:var(--soft); text-decoration:none; border-left:2px solid transparent;
}
.toc li a:hover{color:var(--ink); border-left-color:var(--hair)}
.toc li.sub a{padding-left:24px; font-size:12.5px}
/* 문서 본문 */
article{background:var(--card); border:1px solid var(--hair); border-radius:10px; padding:38px 44px 46px}
@media (max-width:640px){article{padding:24px 20px 30px}}
.doc{max-width:74ch}
.doc > *:first-child{margin-top:0}
.doc h1{font-size:30px; font-weight:700; letter-spacing:-.02em; line-height:1.3; margin:0 0 6px; text-wrap:balance}
.doc h2{
  font-size:20px; font-weight:700; letter-spacing:-.01em; margin:44px 0 12px;
  padding-top:18px; border-top:1px solid var(--hair); text-wrap:balance;
}
.doc h3{font-size:16px; font-weight:700; margin:28px 0 8px}
.doc h1 + p{color:var(--soft); font-size:13px; margin-top:0}
.doc p, .doc li{overflow-wrap:break-word}
.doc ul, .doc ol{padding-left:22px}
.doc li{margin:4px 0}
.doc li > ul{margin:4px 0}
.doc hr{border:0; border-top:1px solid var(--hair); margin:32px 0}
.doc a{color:var(--accent)}
.doc strong{font-weight:700}
.doc blockquote{
  margin:18px 0; padding:12px 18px; border-left:3px solid var(--accent);
  background:var(--accent-dim); border-radius:0 6px 6px 0;
}
.doc blockquote p{margin:0}
.doc code{
  font-family:"IBM Plex Mono",monospace; font-size:.88em;
  background:var(--quiet); border:1px solid var(--hair); border-radius:4px; padding:1px 5px;
}
.doc pre{
  background:var(--quiet); border:1px solid var(--hair); border-radius:8px;
  padding:14px 16px; overflow-x:auto; line-height:1.6;
}
.doc pre code{background:none; border:0; padding:0; font-size:12.5px}
.tablewrap{overflow-x:auto; margin:18px 0; border:1px solid var(--hair); border-radius:8px}
.doc table{border-collapse:collapse; width:100%; font-size:13.5px; font-variant-numeric:tabular-nums}
.doc th, .doc td{text-align:left; padding:9px 14px; border-bottom:1px solid var(--hair); vertical-align:top}
.doc thead th{background:var(--quiet); font-weight:700; white-space:nowrap}
.doc tbody tr:last-child td{border-bottom:0}
.doc td code{white-space:nowrap}
/* 피드백 바 */
.bar{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--hair); padding:14px 24px}
.bar .inner{max-width:1240px; margin:0 auto; display:flex; gap:16px; align-items:center}
.bar .who{font-size:12.5px; font-weight:700; white-space:nowrap}
.bar textarea{
  flex:1; font-family:inherit; font-size:13.5px; line-height:1.5; color:var(--ink);
  background:var(--bg); border:1px solid var(--hair); border-radius:6px;
  padding:9px 11px; min-height:46px; resize:vertical;
}
.bar textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button.save{
  font-family:inherit; font-size:14px; font-weight:700; color:#fff; background:var(--accent);
  border:0; border-radius:7px; padding:12px 26px; cursor:pointer; white-space:nowrap;
}
button.save:hover{filter:brightness(1.08)}
button.save:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.status{font-size:12.5px; color:var(--soft); white-space:nowrap; min-width:13ch}
.status.done{color:var(--ok); font-weight:500}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail">
    <a class="home" href="/">&larr; 디자인 초안 검토로</a>
    <div class="tabs">
      <button type="button" data-doc="prd" class="on">PRD</button>
      <button type="button" data-doc="spec">SPEC</button>
    </div>
    <p class="toc-label">목차</p>
    <ul class="toc" id="toc"></ul>
  </nav>

  <article><div class="doc" id="doc">문서를 불러오는 중입니다.</div></article>
</div>

<div class="bar">
  <div class="inner">
    <span class="who" id="who">PRD 피드백</span>
    <textarea id="note" placeholder="고칠 곳, 빠진 것, 다시 정하고 싶은 결정을 적어 주세요"></textarea>
    <span class="status" id="status">불러오는 중</span>
    <button class="save" id="save" type="button">피드백 저장</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
var DOCS = { prd: { file: '/PRD.md', label: 'PRD' }, spec: { file: '/SPEC.md', label: 'SPEC' } };
var md = {};       // 원본 마크다운
var notes = { prd: '', spec: '' };
var current = 'prd';
var dirty = false;

var docEl = document.getElementById('doc');
var tocEl = document.getElementById('toc');
var noteEl = document.getElementById('note');
var statusEl = document.getElementById('status');

marked.setOptions({ gfm: true, breaks: false });

function slug(text, i) {
  return 'h-' + i + '-' + text.replace(/[^0-9A-Za-z가-힣]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
}

function show(key) {
  current = key;
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.doc === key);
  });
  document.getElementById('who').textContent = DOCS[key].label + ' 피드백';
  noteEl.value = notes[key] || '';
  docEl.innerHTML = marked.parse(md[key] || '');

  // 넓은 표가 페이지 전체를 가로로 밀지 않도록 각자의 상자 안에서 스크롤하게 한다.
  docEl.querySelectorAll('table').forEach(function (t) {
    var wrap = document.createElement('div');
    wrap.className = 'tablewrap';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });

  tocEl.innerHTML = '';
  docEl.querySelectorAll('h2, h3').forEach(function (h, i) {
    h.id = slug(h.textContent, i);
    var li = document.createElement('li');
    if (h.tagName === 'H3') li.className = 'sub';
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocEl.appendChild(li);
  });
  window.scrollTo(0, 0);
}

document.querySelectorAll('.tabs button').forEach(function (b) {
  b.addEventListener('click', function () {
    notes[current] = noteEl.value;
    show(b.dataset.doc);
  });
});

noteEl.addEventListener('input', function () {
  dirty = true;
  statusEl.textContent = '저장하지 않음';
  statusEl.classList.remove('done');
});

document.getElementById('save').addEventListener('click', function () {
  notes[current] = noteEl.value;
  statusEl.textContent = '저장 중';
  statusEl.classList.remove('done');
  var body = { savedAt: new Date().toISOString(), docs: {
    prd: { note: (notes.prd || '').trim() },
    spec: { note: (notes.spec || '').trim() }
  } };
  fetch('/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    dirty = false;
    statusEl.textContent = '저장했습니다';
    statusEl.classList.add('done');
  }).catch(function () {
    statusEl.textContent = '저장 실패 · 서버 확인';
  });
});

window.addEventListener('beforeunload', function (e) {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

Promise.all([
  fetch(DOCS.prd.file).then(function (r) { return r.text(); }),
  fetch(DOCS.spec.file).then(function (r) { return r.text(); }),
  fetch('/feedback').then(function (r) { return r.json(); }).catch(function () { return {}; })
]).then(function (out) {
  md.prd = out[0];
  md.spec = out[1];
  var saved = out[2] && out[2].docs;
  if (saved) {
    notes.prd = (saved.prd && saved.prd.note) || '';
    notes.spec = (saved.spec && saved.spec.note) || '';
    statusEl.textContent = (notes.prd || notes.spec) ? '이전 피드백 불러옴' : '아직 저장 없음';
  } else {
    statusEl.textContent = '아직 저장 없음';
  }
  show('prd');
}).catch(function () {
  docEl.textContent = '문서를 불러오지 못했습니다. 서버가 켜져 있는지 확인해 주세요.';
  statusEl.textContent = '서버 응답 없음';
});
</script>
</body>
</html>
