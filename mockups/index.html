<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>취침 커퓨 앱 초안 검토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#191C22; --soft:#666E7D; --hair:#DFE2E8;
  --accent:#2B5BD7; --accent-dim:#E8EDFB; --ok:#137A47; --stage:#E9EBF0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --card:#181C23; --ink:#E8EBF1; --soft:#98A0B0; --hair:#282E39;
    --accent:#8CA9FF; --accent-dim:#1C2440; --ok:#54D08D; --stage:#0B0D11;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --card:#181C23; --ink:#E8EBF1; --soft:#98A0B0; --hair:#282E39;
  --accent:#8CA9FF; --accent-dim:#1C2440; --ok:#54D08D; --stage:#0B0D11;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR","Malgun Gothic",sans-serif; font-size:14px; line-height:1.6;
  padding:32px 24px 150px;
}
.wrap{max-width:1320px; margin:0 auto; display:flex; flex-direction:column; gap:26px}
.crumb{margin:0 0 10px; font-size:12.5px}
.crumb a{color:var(--soft); text-decoration:none}
.crumb a:hover{color:var(--accent); text-decoration:underline}
header h1{margin:0 0 6px; font-size:26px; font-weight:700; letter-spacing:-.02em; text-wrap:balance}
header p{margin:0; color:var(--soft); max-width:62ch}
.legend{
  display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:12px; font-size:12px; color:var(--soft);
  border-top:1px solid var(--hair); padding-top:12px;
}
.legend b{color:var(--ink); font-weight:500}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(322px,1fr)); gap:20px}
.draft{
  background:var(--card); border:1px solid var(--hair); border-radius:10px;
  display:flex; flex-direction:column; overflow:hidden;
}
.draft.picked{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-dim)}
.draft .top{display:flex; align-items:baseline; gap:8px; padding:14px 16px 10px}
.draft .no{
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--soft);
  border:1px solid var(--hair); border-radius:4px; padding:1px 6px;
}
.draft h2{margin:0; font-size:16px; font-weight:700}
.draft .top a{margin-left:auto; font-size:12px; color:var(--accent); text-decoration:none}
.draft .top a:hover{text-decoration:underline}
.draft .why{margin:0; padding:0 16px 12px; font-size:12.5px; color:var(--soft)}
.stage{
  background:var(--stage); border-top:1px solid var(--hair); border-bottom:1px solid var(--hair);
  height:600px; overflow:hidden; display:flex; justify-content:center;
}
.stage iframe{
  width:390px; height:844px; border:0; flex:none;
  transform:scale(.71); transform-origin:top center;
}
.draft form{padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px}
label.pick{display:flex; align-items:center; gap:9px; font-weight:500; cursor:pointer}
label.pick input{width:17px; height:17px; accent-color:var(--accent); cursor:pointer}
textarea{
  font-family:inherit; font-size:13.5px; line-height:1.55; color:var(--ink);
  background:var(--bg); border:1px solid var(--hair); border-radius:6px;
  padding:9px 11px; min-height:88px; resize:vertical; width:100%;
}
textarea:focus-visible, label.pick input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
textarea::placeholder{color:var(--soft)}
.bar{
  position:fixed; left:0; right:0; bottom:0; background:var(--card);
  border-top:1px solid var(--hair); padding:14px 24px;
}
.bar .inner{max-width:1320px; margin:0 auto; display:flex; gap:16px; align-items:center}
.bar textarea{min-height:46px; flex:1}
button.save{
  font-family:inherit; font-size:14px; font-weight:700; color:#fff; background:var(--accent);
  border:0; border-radius:7px; padding:12px 26px; cursor:pointer; white-space:nowrap;
}
button.save:hover{filter:brightness(1.08)}
button.save:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.status{font-size:12.5px; color:var(--soft); white-space:nowrap; min-width:13ch}
.status.done{color:var(--ok); font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="crumb"><a href="/docs.html">기획 문서 (PRD · SPEC) 보기 &rarr;</a></p>
    <h1>취침 커퓨 앱 &mdash; 디자인 초안 5종</h1>
    <p>다섯 초안 모두 같은 표본 데이터를 씁니다. 각 초안 상단의 시각 입력을 바꾸면 그래프의 제한 시간대 음영과 아래 숫자가 실제로 다시 계산되고, 선과 막대 전환도 동작합니다.</p>
    <div class="legend">
      <span><b>표본 간격</b> 10분 · 하루 144칸</span>
      <span><b>세로축</b> 그 10분 중 화면을 켜 둔 분(0&ndash;10)</span>
      <span><b>원</b> 초록은 그날 커퓨 성공, 빨강은 실패</span>
      <span><b>표본 주간</b> 9/2&ndash;9/8 중 5일 성공</span>
    </div>
  </header>

  <div class="grid" id="grid"></div>
</div>

<div class="bar">
  <div class="inner">
    <textarea id="overall" placeholder="전체 총평 · 섞고 싶은 조합 · 빠진 기능을 적어 주세요"></textarea>
    <span class="status" id="status">불러오는 중</span>
    <button class="save" id="save" type="button">피드백 저장</button>
  </div>
</div>

<script>
var DRAFTS = [
  { id:'d1', name:'야간 계기판',
    why:'딥 인디고 위 데이터 밀집형 대시보드. 제한 시간대를 24시간 트랙으로 보여 주고, 성공 점과 통계를 한 화면에 모읍니다.' },
  { id:'d2', name:'수면 기록지',
    why:'모눈종이 위에 손으로 채우는 기록지. 성공과 실패가 비뚤게 찍힌 도장으로 남고, 명조체가 기록의 무게를 만듭니다.' },
  { id:'d3', name:'주간 성적표',
    why:'성공 원이 화면의 주인공. 굵은 제목과 큰 원이 위쪽 절반을 차지하고, 그래프는 아래로 물러납니다.' },
  { id:'d4', name:'위젯 스택',
    why:'둥근 카드를 쌓은 부드러운 구성. 시간대, 주간 기록, 그래프가 각자의 카드에 들어가고 다크 모드까지 대응합니다.' },
  { id:'d5', name:'커퓨 터미널',
    why:'고정폭 격자에 얹은 로그 뷰. 설정은 config 표로, 주간 기록은 한 줄 로그로, 그래프는 인광 앰버 막대로 읽힙니다.' }
];

var grid = document.getElementById('grid');
grid.innerHTML = DRAFTS.map(function (d, i) {
  return '<article class="draft" id="card-' + d.id + '">' +
    '<div class="top"><span class="no">' + (i + 1) + '</span><h2>' + d.name + '</h2>' +
    '<a href="' + d.id + '.html" target="_blank" rel="noopener">크게 보기</a></div>' +
    '<p class="why">' + d.why + '</p>' +
    '<div class="stage"><iframe src="' + d.id + '.html" title="' + d.name + ' 초안"></iframe></div>' +
    '<form><label class="pick"><input type="checkbox" data-pick="' + d.id + '">이 초안을 후보로 남긴다</label>' +
    '<textarea data-note="' + d.id + '" placeholder="' + d.name + '에 대한 피드백"></textarea></form>' +
    '</article>';
}).join('');

var statusEl = document.getElementById('status');
var overall = document.getElementById('overall');
var dirty = false;

function collect() {
  var drafts = {};
  DRAFTS.forEach(function (d) {
    drafts[d.id] = {
      name: d.name,
      picked: document.querySelector('[data-pick="' + d.id + '"]').checked,
      note: document.querySelector('[data-note="' + d.id + '"]').value.trim()
    };
  });
  return { savedAt: new Date().toISOString(), overall: overall.value.trim(), drafts: drafts };
}

function markPicked(id, on) {
  document.getElementById('card-' + id).classList.toggle('picked', on);
}

document.addEventListener('input', function (e) {
  if (!e.target.matches('textarea, input[type=checkbox]')) return;
  dirty = true;
  statusEl.textContent = '저장하지 않음';
  statusEl.classList.remove('done');
  if (e.target.dataset.pick) markPicked(e.target.dataset.pick, e.target.checked);
});

document.getElementById('save').addEventListener('click', function () {
  statusEl.textContent = '저장 중';
  statusEl.classList.remove('done');
  fetch('/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(collect())
  }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    dirty = false;
    statusEl.textContent = '저장했습니다';
    statusEl.classList.add('done');
  }).catch(function () {
    statusEl.textContent = '저장 실패 · 서버 확인';
  });
});

window.addEventListener('beforeunload', function (e) {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

fetch('/feedback').then(function (r) { return r.json(); }).then(function (saved) {
  if (!saved || !saved.drafts) { statusEl.textContent = '아직 저장 없음'; return; }
  DRAFTS.forEach(function (d) {
    var s = saved.drafts[d.id];
    if (!s) return;
    var box = document.querySelector('[data-pick="' + d.id + '"]');
    box.checked = !!s.picked;
    markPicked(d.id, box.checked);
    document.querySelector('[data-note="' + d.id + '"]').value = s.note || '';
  });
  overall.value = saved.overall || '';
  statusEl.textContent = '이전 피드백 불러옴';
}).catch(function () { statusEl.textContent = '서버 응답 없음'; });
</script>
</body>
</html>
