<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커퓨 터미널</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
:root{
  --bg:#0A0A0A; --panel:#111110; --text:#D9D3C5; --dim:#6E6A60; --hair:#242320;
  --amber:#FFB000; --ok:#4EE07A; --bad:#FF4D4D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; width:390px; min-height:844px; background:var(--bg); color:var(--text);
  font-family:"Nanum Gothic Coding","Consolas",monospace; font-size:13px; line-height:1.7;
  padding:22px 16px 26px; display:flex; flex-direction:column; gap:16px;
  font-variant-numeric:tabular-nums;
}
.prompt{color:var(--dim)}
.prompt b{color:var(--ok); font-weight:400}
.prompt em{color:var(--text); font-style:normal}
.rule{border:0; border-top:1px solid var(--hair); margin:0}
h1{margin:0; font-size:15px; font-weight:700; color:var(--amber); letter-spacing:.02em}
h2{margin:0 0 8px; font-size:12px; font-weight:400; color:var(--dim)}
h2::before{content:"## "; color:var(--hair)}
/* 설정 표 */
.kv{display:grid; grid-template-columns:auto 1fr; gap:2px 12px; align-items:baseline}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.kv .tskin{
  font-family:inherit; font-size:13px; font-weight:700; color:var(--amber);
  background:var(--panel); border:1px solid var(--hair); border-radius:2px;
  padding:1px 6px;
}
.kv .tskin:focus-within{outline:1px solid var(--amber); outline-offset:1px; border-color:var(--amber)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .amber{color:var(--amber)}
/* 주간 로그 */
.log{display:grid; grid-template-columns:auto auto 1fr auto; gap:0 12px; align-items:center}
.log > *{padding:2px 0}
.log .dot{width:11px; height:11px; border-radius:50%; display:block}
.log .dot.g{background:var(--ok)}
.log .dot.r{background:var(--bad)}
.log .date{color:var(--dim)}
.log .msg{color:var(--text)}
.log .val{color:var(--dim); text-align:right}
/* 차트 */
.chart-head{display:flex; justify-content:space-between; align-items:center}
.seg{display:flex; gap:6px}
.seg button{
  font-family:inherit; font-size:12px; padding:1px 4px; cursor:pointer;
  background:none; border:0; color:var(--dim);
}
.seg button::before{content:"["} .seg button::after{content:"]"}
.seg button.is-on{color:var(--amber); font-weight:700}
.seg button:focus-visible{outline:1px solid var(--amber); outline-offset:1px}
svg{display:block; width:100%; height:auto; background:var(--panel); border:1px solid var(--hair)}
.cx-band{fill:rgba(255,176,0,.09)}
.cx-grid{stroke:var(--hair); stroke-width:1}
.cx-label{fill:var(--dim); font-family:"Nanum Gothic Coding",monospace; font-size:9px}
.cx-label-y{text-anchor:end}
.cx-bar{fill:var(--amber)}
.cx-line{fill:none; stroke:var(--amber); stroke-width:1.4; stroke-linejoin:round}
.cx-area{fill:var(--amber); opacity:.12}
.exit{color:var(--dim); font-size:12px}
.exit b{color:var(--ok); font-weight:400}
.cursor{display:inline-block; width:7px; height:14px; background:var(--amber); vertical-align:-2px}
@media (prefers-reduced-motion:no-preference){
  .cursor{animation:blink 1.1s steps(1,end) infinite}
  @keyframes blink{50%{opacity:0}}
}
</style>
</head>
<body>
  <div>
    <p class="prompt" style="margin:0"><b>~</b> <em>curfew status --week</em></p>
    <h1>CURFEW 02:00</h1>
  </div>
  <hr class="rule">

  <section>
    <h2>config</h2>
    <dl class="kv">
      <dt>start</dt>
      <dd><input type="time" id="from" value="02:00" step="600" aria-label="제한 시작 시각"></dd>
      <dt>release</dt>
      <dd><input type="time" id="to" value="07:00" step="600" aria-label="제한 종료 시각"></dd>
      <dt>sample</dt>
      <dd>600s (10분)</dd>
      <dt>state</dt>
      <dd class="ok">armed</dd>
    </dl>
  </section>
  <hr class="rule">

  <section>
    <h2>week log</h2>
    <div class="log" id="log"></div>
  </section>
  <hr class="rule">

  <section>
    <div class="chart-head">
      <h2 id="day" style="margin:0"></h2>
      <div class="seg">
        <button type="button" data-mode="line" class="is-on" aria-pressed="true">line</button>
        <button type="button" data-mode="bar" aria-pressed="false">bar</button>
      </div>
    </div>
    <svg id="chart" role="img" aria-label="10분 간격 핸드폰 사용 그래프" style="margin-top:8px"></svg>
  </section>

  <p class="exit" id="exit"></p>

<script src="common.js"></script>
<script>
document.getElementById('day').textContent = 'usage ' + DAY_LABEL;
document.getElementById('log').innerHTML = WEEK.map(function (x) {
  var ok = x.ok;
  return '<span class="dot ' + (ok ? 'g' : 'r') + '"></span>' +
         '<span class="date">' + x.d + ' ' + x.w + '</span>' +
         '<span class="msg">' + (ok ? 'curfew held' : 'curfew broken') + '</span>' +
         '<span class="val">' + (ok ? '0m' : (x.d === '9/4' ? '48m' : '95m')) + '</span>';
}).join('');

wireDraft({
  svg: '#chart', from: '#from', to: '#to', toggle: '.seg button',
  onRender: function (min, s, e) {
    document.getElementById('exit').innerHTML =
      '<b>exit 0</b> &nbsp;streak=' + STREAK + 'd &nbsp;week=' + WEEK_OK + '/7 &nbsp;' +
      'total=' + TOTAL_MIN + 'm &nbsp;in_window=' +
      '<span class="' + (min === 0 ? 'ok' : 'bad') + '">' + min + 'm</span> ' +
      '<span class="cursor"></span>';
  }
});
</script>
</body>
</html>
